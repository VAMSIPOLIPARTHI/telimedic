<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Consultation</title>
    <style>
         
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff; /* White background */
            color: #333;
        }

        .header {
            background: linear-gradient(90deg,black);
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 180px;
            height: auto;
            border-radius: 50%;
            margin-left: 20px;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            flex-grow: 1;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }

        iframe {
            border: 2px solid black;
            border-radius: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }

        a:hover {
            background:black;
        }
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='images/Swasthya logo with a catchy tagline.png') }}" alt="Swasthya Logo" class="logo">
    <div class="container">
        <h2>Join Video Consultation</h2>
        <iframe 
    src="https://meet.jit.si/TelemedicineConsultation" 
    width="800" 
    height="600" 
    allow="camera; microphone; autoplay; fullscreen; clipboard-write" 
    allowfullscreen>
</iframe>

        <br>
        <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
</body>
</html>
