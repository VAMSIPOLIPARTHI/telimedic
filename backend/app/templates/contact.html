<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Navigation Bar */
        nav {
            width: 100%;
            background: #000;
            padding: 15px 0;
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #3498db;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 100px auto 30px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        /* Contact Information */
        .contact-info {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .contact-card {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 30%;
            min-width: 250px;
            margin: 15px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .contact-card i {
            font-size: 32px;
            color: #000;
            margin-bottom: 10px;
        }

        .contact-card h3 {
            color: #000;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .contact-card p {
            color: #555;
            font-size: 14px;
            margin: 5px 0;
        }

        /* Contact Form */
        .contact-form {
            margin-top: 40px;
            text-align: left;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-form h2 {
            color: #000;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .contact-form input:focus, .contact-form textarea:focus {
            border-color: #000;
        }

        .contact-form button {
            padding: 12px 20px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .contact-form button:hover {
            background: #444;
        }

        /* Google Maps */
        .map-container {
            margin-top: 40px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .map-container iframe {
            width: 100%;
            height: 300px;
            border: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .contact-card {
                width: 100%;
                margin: 10px 0;
            }

            .contact-form {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('services') }}">Services</a></li>
            <li><a href="{{ url_for('about') }}">About Us</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Contact Section -->
    <div class="container">
        <h1>Contact Us</h1>

        <!-- Contact Information -->
        <div class="contact-info">
            <div class="contact-card">
                <i class="fas fa-map-marker-alt"></i>
                <h3>Our Office</h3>
                <p>Ring Road</p>
                <p>Vizianagaram, A.P, 535002</p>
                <p>India</p>
            </div>
            <div class="contact-card">
                <i class="fas fa-phone"></i>
                <h3>Call Us</h3>
                <p>+91 7893190139</p>
                <p>+91 9885064713</p>
            </div>
            <div class="contact-card">
                <i class="fas fa-envelope"></i>
                <h3>Email Us</h3>
                <p>swasthya@gmail.com</p>
            </div>
        </div>

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Send us a message</h2>
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

        <!-- Google Maps Embed -->
        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3798.3154345093747!2d83.39555031531664!3d18.106657742021665!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a3be4c6c2b6c3e7%3A0x6c5a7b2e8f8e8c7b!2sVizianagaram%2C%20Andhra%20Pradesh%2C%20India!5e0!3m2!1sen!2sus!4v1633023226788!5m2!1sen!2sus" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
    (function() {
        emailjs.init("YhMRRey6axG4mJBRf"); // Replace with your new API Key
    })();

    document.getElementById("contactForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent default form submission

        let formData = {
            name: document.querySelector("input[name='name']").value,
            email: document.querySelector("input[name='email']").value,
            message: document.querySelector("textarea[name='message']").value,
            to_email: "vamsipoliparthi13@gmail.com"  // Hardcoded recipient email
        };

        emailjs.send("service_2pqze3l", "template_3kjw5l", formData)
        .then(function(response) {
            alert("Your message has been sent successfully!");
            document.getElementById("contactForm").reset();
        }, function(error) {
            alert("Error sending message. Please try again!");
            console.error("Email.js Error:", error);
        });
    });
</script>

</html>
