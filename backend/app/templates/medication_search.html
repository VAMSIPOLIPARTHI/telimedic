<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Search</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Logo Styling */
        .logo {
            width: 180px;
            height: auto;
            border-radius: 50%;
            margin-left: 20px;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        /* Main Heading */
        h1 {
            font-size: 28px;
            color: #2c3e50;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Form Container */
        .form-container {
            background:blaCK;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        input[type="text"] {
            width: 90%;
            padding: 10px;
            border: 2px black;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        input[type="text"]:focus {
            border-color: black;
            box-shadow: 0px 2px black;
        }

        button {
            background-color: white;
            color: black;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color:white;
            transform: scale(1.05);
        }

        /* Results Section */
        .results {
            width: 90%;
            max-width: 450px;
            background: #ffffff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            font-size: 22px;
            color: #2980b9;
            font-weight: 600;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f1f1f1;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            font-weight: 500;
        }

        li:hover {
            background:black;
            color: white;
            transform: translateY(-3px);
            transition: 0.3s ease-in-out;
        }

    </style>
</head>
<body>

    <!-- Logo -->
    <img src="{{ url_for('static', filename='images/Swasthya logo with a catchy tagline.png') }}" alt="Swasthya Logo" class="logo">

    <!-- Search Form -->
    <div class="form-container">
        <h1>Medication Search</h1>
        <form method="post">
            <label for="disease">Enter Disease:</label>
            <input type="text" id="disease" name="disease" required>
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Display Medication Results -->
    {% if disease %}
    <div class="results">
        <h2>Medications for {{ disease }}:</h2>
        <ul>
            {% for medication in medications %}
                <li>{{ medication }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</body>
</html>
