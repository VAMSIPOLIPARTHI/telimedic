<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* General Styles */
        body {
            background: #ffffff;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #000;
        }

        /* Header */
        .admin-header {
            width: 100%;
            background: #000;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        /* Sidebar Styling */
        .sidebar {
            position: fixed;
            left: -250px; /* Initially Hidden */
            top: 0;
            width: 250px;
            height: 100vh;
            background: #000;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.3);
            padding: 20px;
            z-index: 10;
            transition: left 0.3s ease-in-out;
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-toggle {
            position: absolute;
            right: -60px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: black;
            color: white;
            font-size: 32px;
            font-weight: bold;
            border: none;
            border-radius: 0 12px 12px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease-in-out;
        }

        .sidebar-toggle:hover {
            background: gray;
            transform: translateY(-50%) scale(1.1);
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 80px;
        }

        .sidebar li {
            margin: 15px 0;
        }

        .sidebar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            display: block;
            padding: 12px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        /* Admin Login Form */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin-top: 50px; /* Adjusted to fit below the header */
        }

        .login-form {
            width: 400px;
            padding: 40px;
            background: #000;
            color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            z-index: 2;
        }

        .login-form h2 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        @keyframes fadeIn {
            0% { transform: translateY(-10px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Input Fields */
        .input-group {
            position: relative;
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            color: white;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 12px;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 16px;
            background: transparent;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        input:focus {
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Login Button */
        button[type="submit"] {
            width: 100%;
            height: 45px;
            background: white;
            color: black;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.4s;
        }

        button[type="submit"]:hover {
            background: #e0e0e0;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(255, 255, 255, 0.3);
        }

        /* Flash Messages */
        .alert {
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .alert-success {
            background: #4CAF50;
            color: white;
        }

        .alert-danger {
            background: #ff6b6b;
            color: white;
        }

    </style>
</head>
<body>

    <!-- Admin Login Header -->
    <div class="admin-header">
        Admin's Login
    </div>

    <!-- Sidebar with toggle button -->
    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">≡</button>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </div>

    <!-- Admin Login Form -->
    <div class="container">
        <div class="login-form">
            <img src="{{ url_for('static', filename='images/Swasthya logo with a catchy tagline.png') }}" alt="Swasthya Logo" class="logo" width="150px">
            <h2>Admin Login</h2>
            <form action="{{ url_for('login_admin') }}" method="POST">
                <div class="input-group">
                    <label for="admin_id">Admin ID:</label>
                    <input type="text" id="admin_id" name="admin_id" required>
                </div>
                <div class="input-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>
    </div>

    <!-- JavaScript for sidebar toggle -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('sidebarToggle');
        
        toggleButton.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            toggleButton.textContent = sidebar.classList.contains('active') ? '×' : '≡';
        });
    </script>

</body>
</html>
