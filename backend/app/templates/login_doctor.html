<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            background: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: auto;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        /* Logo Styling */
        .logo {
            width: 150px;
            height: auto;
            border-radius: 50%;
            background: black;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        /* Page Title */
        h1 {
            font-size: 36px;
            font-weight: 700;
            text-align: center;
            color: black;
            margin-top: 15px;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -250px;
            top: 0;
            width: 250px;
            height: 100vh;
            background: black;
            padding: 20px;
            transition: left 0.3s ease-in-out;
            z-index: 10;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.2);
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar-toggle {
            position: absolute;
            right: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: black;
            color: white;
            font-size: 28px;
            border: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: #555;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            margin-top: 60px;
        }

        .sidebar li {
            margin: 20px 0;
        }

        .sidebar a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: 500;
            display: block;
            padding: 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .sidebar a:hover {
            background: white;
            color: black;
        }

        /* Login Form */
        .login-container {
            width: 400px;
            padding: 30px;
            background: white;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 6px 6px 0px black;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
            z-index: 2;
        }

        @keyframes fadeIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Input Fields */
        input {
            width: 100%;
            height: 45px;
            padding: 10px;
            border: 2px solid black;
            border-radius: 5px;
            font-size: 16px;
            background: white;
            transition: 0.3s ease-in-out;
        }

        input:focus {
            border-color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        label {
            font-size: 18px;
            font-weight: bold;
            color: black;
            text-align: left;
            display: block;
            margin-bottom: 5px;
        }

        /* Login Button */
        button {
            width: 100%;
            height: 50px;
            background: black;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        button:hover {
            background: white;
            color: black;
            border: 2px solid black;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .login-container {
                width: 90%;
            }
            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>
<body>

    <img src="{{ url_for('static', filename='images/Swasthya logo with a catchy tagline.png') }}" alt="Swasthya Logo" class="logo">

    <h1>Doctors Login</h1>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Sidebar">≡</button>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
        </ul>
    </div>  

    <div class="login-container">
        <form method="POST" action="/login_doctor">
            <label for="doctor_id">Doctor ID:</label>
            <input type="text" id="doctor_id" name="doctor_id" required>

            <label for="doctor_password">Password:</label>
            <input type="password" id="doctor_password" name="doctor_password" required>

            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const toggleButton = document.getElementById('sidebarToggle');
        
        toggleButton.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            toggleButton.textContent = sidebar.classList.contains('active') ? '×' : '≡';
        });
    </script>

</body>
</html>
