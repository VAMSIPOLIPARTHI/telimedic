<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Lab Reports</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #ffffff; /* Changed to White */
            color: #333;
        }

        .header {
            background: black;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 180px;
            height: auto;
            border-radius: 50%;
            margin-left: 20px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background:black;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        tr:hover {
            background: #e3f2fd;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
            font-weight: bold;
        }

        a:hover {
            background: black;
        }

        .btn-secondary {
            background: black;
        }

        .btn-secondary:hover {
            background: black;
        }
    </style>
</head>
<body>
    <img src="{{ url_for('static', filename='images/Swasthya logo with a catchy tagline.png') }}" alt="Swasthya Logo" class="logo">
    
        <h2>Your Uploaded Lab Reports</h2>
        {% if lab_reports|length > 0 %}
            <table>
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>File Name</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for report in lab_reports %}
                        <tr>
                            <td>{{ report.patient_id }}</td>
                            <td>{{ report.file_path.split('/')[-1] }}</td>
                            <td><a href="{{ url_for('reply_lab_report', report_id=report.id) }}">Reply</a> | <a href="{{ url_for('download_lab_report', report_id=report.id) }}">Download</a></td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        {% else %}
            <p>No lab reports uploaded by you yet.</p>
        {% endif %}
        <a href="{{ url_for('doctor_dashboard') }}">Back to Dashboard</a>
    </body>
    </html>
